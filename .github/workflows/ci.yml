name: ci

# master への PR で CI（lint/test/secret scan/terraform検証/tflint）を実行。
# terraform 検証は infra/（ECS）と lambda-efs-sqlite/（Lambda）の両方が対象。
on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write # gitleaks-action が検出結果を PR にコメントするために必要

jobs:
  # ---------------------------------------------------------------
  # CI: lint / test / secret scan / terraform 検証（失敗でブロック）
  # ---------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
          cache-dependency-path: app/go.sum

      - name: gofmt (fail if unformatted)
        working-directory: app
        run: test -z "$(gofmt -l .)" || (echo 'run gofmt' && gofmt -l . && exit 1)

      - name: go vet
        working-directory: app
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13.2
          working-directory: app

      - name: go test
        working-directory: app
        run: go test -cover ./...

      - name: build Lambda binary (arm64)
        run: ./lambda-efs-sqlite/build.sh

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.12.2"

      - name: terraform fmt / validate
        run: |
          for dir in infra lambda-efs-sqlite; do
            echo "::group::$dir"
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.55.1

      - name: tflint
        env:
          # tflint --init のプラグイン取得が未認証だと GitHub API のレート制限に
          # 引っかかりやすいため、GITHUB_TOKEN を渡して認証済みリクエストにする
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in infra lambda-efs-sqlite; do
            echo "::group::$dir"
            (cd "$dir" && tflint --init && tflint --recursive)
            echo "::endgroup::"
          done
