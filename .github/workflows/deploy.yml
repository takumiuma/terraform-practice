name: build-and-deploy

# main への push で CI（lint/test/tf検証）→ ビルド → ECR push → ECS デプロイ → スモーク。
# 手動実行も可能。AWS 認証は OIDC + IAM ロール引き受け（長期キーなし）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC でトークンを取得するために必須

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: gin-ecs-cheap
  ECS_CLUSTER: gin-ecs-cheap
  ECS_SERVICE: gin-ecs-cheap
  ECS_TASK_FAMILY: gin-ecs-cheap
  CONTAINER_NAME: gin-ecs-cheap
  CONTAINER_PORT: "8080"

jobs:
  # ---------------------------------------------------------------
  # CI: lint / test / secret scan / terraform 検証（失敗でブロック）
  # ---------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.22"
          cache-dependency-path: app/go.sum

      - name: gofmt (fail if unformatted)
        working-directory: app
        run: test -z "$(gofmt -l .)" || (echo 'run gofmt' && gofmt -l . && exit 1)

      - name: go vet
        working-directory: app
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1481404843c368bc19ca9406f87d6e0fc97bdcfd # v7.0.0
        with:
          version: v1.64.8
          working-directory: app

      - name: go test
        working-directory: app
        run: go test -cover ./...

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.9
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.12.2"

      - name: terraform fmt / validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.55.1

      - name: tflint
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive

  # ---------------------------------------------------------------
  # CD: build → ECR push → ECS deploy → smoke
  # ---------------------------------------------------------------
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push image (SHA tag)
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" ./app
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Render new task definition
        id: taskdef
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          # 既存のタスク定義を取得し、image を差し替えて register する
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition' --output json > taskdef.json
          # 登録に不要なフィールドを除去し、image を更新
          jq --arg IMAGE "$IMAGE" --arg NAME "$CONTAINER_NAME" '
            .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
            | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, requiresCompatibilities, cpu, memory, runtimePlatform}
          ' taskdef.json > new-taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        env:
          NEW_TASKDEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASKDEF_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Smoke test (/healthz)
        run: |
          # 実行中タスクのパブリック IP を取得して /healthz を叩く
          TASK_ARN=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" \
            --desired-status RUNNING --query 'taskArns[0]' --output text)
          ENI=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          echo "task public ip: $IP"
          for i in 1 2 3 4 5; do
            if curl --fail --max-time 5 "http://$IP:$CONTAINER_PORT/healthz"; then
              echo "smoke test passed"
              exit 0
            fi
            echo "retry $i..."; sleep 10
          done
          echo "smoke test failed"; exit 1
